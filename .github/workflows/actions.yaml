name: Github CI
on: [push]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Install Codon
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz | tar zxvf - -C ${HOME}/.codon/lib/codon/plugins
          export PATH=${PATH}:${HOME}/.codon/bin
      - name: Check out repository code
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Codon Python bridge
        run: |
          pip install find_libpython
          export CODON_PYTHON=$(find_libpython)
          echo "Found Python at: ${CODON_PYTHON}"
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: Set Codon environment
        run: |
          echo "${HOME}/.codon/bin" >> $GITHUB_PATH
          echo "LD_LIBRARY_PATH=${HOME}/.codon/lib/codon:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: Install Python dependencies
        run: |
          pip install numpy
          pip install matplotlib
          pip install biotite
          pip install pytest
          pip install -r week5/requirements.txt
          pip install scanpy
          pip install pyroe
          pip install celltypist
      # pip install -r week5/requirements.txt
          # sudo apt install samtools
          # sudo apt install bzip2
          # sudo apt install autoconf
          # sudo apt install libbz2-dev
          # sudo apt-get install -y zlib1g-dev liblzma-dev libcurl4-openssl-dev
          # sudo apt-get install -y openjdk-17-jre
          # sudo apt install igv
      # - name: Week 1
      #   run: bash week1/evaluate.sh
      # - name: Week 3
      #   run: bash week3/evaluate.sh
      # - name: Week 4
      #   run: bash week4/evaluate.sh
      # - name: Week 5
      #   run: |
      #     cd week5
      #     jupyter nbconvert --execute week5.ipynb --to markdown --output week5
      #     cat week5.md
      - name: Week 6
        run: |
          cd week6
          jupyter nbconvert --execute week6.ipynb --to markdown --output week6
          cat week6.md
